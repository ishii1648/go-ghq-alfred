name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macOS-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: test
        run: make test
      - name: build
        run: make dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghq-alfred.alfredworkflow
          path: ./ghq-alfred.alfredworkflow
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./ghq-alfred.alfredworkflow
