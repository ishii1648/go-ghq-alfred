name: test
on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: download modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: go mod download
      - name: test
        run: make test
      - name: build
        run: make dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghq-alfred.alfredworkflow
          path: ./ghq-alfred.alfredworkflow
